<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>跑酷大冒险 - 高级像素版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #f5f5f5; 
            font-family: "Microsoft YaHei", Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #gameTitle { font-size: 28px; color: #e63946; margin-bottom: 10px; }
        #gameContainer { 
            position: relative; 
            border: 4px solid #2b2d42; 
            border-radius: 8px; 
            background: #8d99ae;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        canvas { display: block; }
        #ui { 
            position: absolute; 
            top: 10px; 
            left: 0; 
            width: 100%; 
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 2px #000;
            z-index: 10;
        }
        #comboTip { 
            position: absolute; 
            top: 60px; 
            left: 50%; 
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #ffd166;
            text-shadow: 2px 2px 3px #e63946;
            display: none;
            z-index: 10;
        }
        #gameOver { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            background: rgba(43,45,66,0.95);
            padding: 30px 40px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            display: none;
            z-index: 20;
        }
        #gameOver h2 { color: #e63946; font-size: 32px; margin-bottom: 15px; }
        #gameOver p { font-size: 18px; margin: 8px 0; }
        #gameOver p span { color: #ffd166; font-weight: bold; }
        #restartBtn { 
            margin-top: 20px; 
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #2b2d42;
            background: #ffd166;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #restartBtn:hover { background: #faa307; transform: scale(1.05); }
        #startTip {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-shadow: 2px 2px 3px #000;
            z-index: 15;
        }
    </style>
</head>
<body>
    <h1 id="gameTitle">跑酷大冒险</h1>
    <div id="gameContainer">
        <div id="ui">
            <span>分数：<span id="score">0</span></span>
            <span>连击：<span id="combo">0</span>x</span>
            <span>最高：<span id="highScore">0</span></span>
        </div>
        <div id="comboTip">连击x3！双倍得分</div>
        <div id="startTip">点击/按空格开始游戏</div>
        <div id="gameOver">
            <h2>游戏结束</h2>
            <p>本次得分：<span id="finalScore">0</span></p>
            <p>最高得分：<span id="finalHighScore">0</span></p>
            <p>最高连击：<span id="maxCombo">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        // 全局配置与DOM节点
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const highScoreEl = document.getElementById('highScore');
        const comboTip = document.getElementById('comboTip');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const finalHighScoreEl = document.getElementById('finalHighScore');
        const maxComboEl = document.getElementById('maxCombo');
        const restartBtn = document.getElementById('restartBtn');
        const startTip = document.getElementById('startTip');

        // 游戏全局状态
        let gameState = 'ready'; // ready/playing/over
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let highScore = localStorage.getItem('parkourHighScore') || 0;
        let highCombo = localStorage.getItem('parkourMaxCombo') || 0;
        highScoreEl.textContent = highScore;
        finalHighScoreEl.textContent = highScore;
        maxComboEl.textContent = highCombo;

        // 游戏常量（可自定义调整）
        const GRAVITY = 0.6; // 重力加速度
        const JUMP_FORCE = -15; // 初始跳跃力
        const SECOND_JUMP_FORCE = -12; // 二段跳力
        const PLAYER_SPEED = 5; // 角色基础速度（背景滚动同步）
        const OBSTACLE_SPAWN_INTERVAL = 1500; // 初始障碍生成间隔(ms)
        const PROP_SPAWN_RATE = 0.15; // 道具生成概率(0-1)
        const COMBO_DOUBLE_SCORE = 3; // 触发双倍得分的连击数

        // 对象池（优化性能，减少对象创建/销毁）
        let obstacles = [];
        let props = [];
        let particles = [];

        // ---------------------- 面向对象 - 背景层（视差滚动）----------------------
        class BackgroundLayer {
            constructor(speed, color, height, yPos) {
                this.speed = speed; // 滚动速度（越小越远）
                this.color = color; // 层颜色
                this.height = height; // 层高度
                this.yPos = yPos; // 层Y坐标
                this.x1 = 0;
                this.x2 = canvas.width;
                this.elements = []; // 层内装饰元素（云朵/石头）
                this.initElements();
            }
            // 初始化层内装饰元素
            initElements() {
                const count = this.speed * 10; // 速度越快，元素越多
                for (let i = 0; i < count; i++) {
                    this.elements.push({
                        x: Math.random() * canvas.width,
                        y: this.yPos + Math.random() * this.height / 2,
                        size: Math.random() * 15 + 5,
                        alpha: Math.random() * 0.7 + 0.3
                    });
                }
            }
            // 更新滚动位置
            update() {
                this.x1 -= this.speed * PLAYER_SPEED;
                this.x2 -= this.speed * PLAYER_SPEED;
                // 循环滚动（超出画布重置）
                if (this.x1 <= -canvas.width) this.x1 = canvas.width;
                if (this.x2 <= -canvas.width) this.x2 = canvas.width;
                // 更新装饰元素位置
                this.elements.forEach(el => {
                    el.x -= this.speed * PLAYER_SPEED;
                    if (el.x < -el.size) el.x = canvas.width + el.size;
                });
            }
            // 绘制层
            draw() {
                // 绘制两层背景（实现循环）
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x1, this.yPos, canvas.width, this.height);
                ctx.fillRect(this.x2, this.yPos, canvas.width, this.height);
                // 绘制装饰元素
                this.elements.forEach(el => {
                    ctx.globalAlpha = el.alpha;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(el.x, el.y, el.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            }
        }

        // ---------------------- 面向对象 - 玩家角色（像素帧动画）----------------------
        class Player {
            constructor() {
                // 基础属性
                this.x = 100;
                this.y = canvas.height - 100;
                this.width = 50;
                this.height = 60;
                this.velocityY = 0;
                this.isJumping = false;
                this.canSecondJump = false;
                this.isSliding = false;
                this.isDashing = false;
                this.dashTime = 0;
                this.dashDuration = 1500; // 冲刺持续时间(ms)
                // 帧动画属性
                this.animationFrame = 0;
                this.animationSpeed = 8; // 帧切换速度（值越小越快）
                this.frameCount = 0;
                // 碰撞盒（精准碰撞，比角色尺寸略小）
                this.hitbox = {
                    x: this.x + 10,
                    y: this.y + 5,
                    width: this.width - 20,
                    height: this.height - 10
                };
            }
            // 绘制角色（像素帧动画模拟，分状态绘制）
            draw() {
                ctx.save();
                // 状态判断：冲刺/跳跃/滑行/奔跑
                if (this.isDashing) {
                    ctx.fillStyle = '#ffd166'; // 冲刺黄色
                    ctx.shadowColor = '#faa307';
                    ctx.shadowBlur = 15;
                } else if (this.isJumping) {
                    ctx.fillStyle = '#e63946'; // 跳跃红色
                } else if (this.isSliding) {
                    ctx.fillStyle = '#06d6a0'; // 滑行绿色
                    // 滑行时缩小碰撞盒，改变形状
                    this.hitbox.height = this.height / 2;
                    this.hitbox.y = this.y + this.height / 2;
                } else {
                    ctx.fillStyle = '#118ab2'; // 奔跑蓝色
                    // 奔跑帧动画（左右晃动模拟腿部动作）
                    this.frameCount++;
                    if (this.frameCount % this.animationSpeed === 0) {
                        this.animationFrame = 1 - this.animationFrame;
                    }
                }

                // 绘制角色主体（像素风格简化版）
                if (this.isSliding) {
                    // 滑行姿态：矮矩形
                    ctx.fillRect(this.x, this.y + 30, this.width, 30);
                } else {
                    // 站立/跳跃/奔跑姿态：矩形+头部
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y - 10, 15, 0, Math.PI * 2);
                    ctx.fill();
                    // 奔跑帧动画：左右移动手臂
                    ctx.fillRect(this.x - 5 + (this.animationFrame * 10), this.y + 20, 10, 20);
                    ctx.fillRect(this.x + this.width - 5 - (this.animationFrame * 10), this.y + 20, 10, 20);
                }

                // 冲刺特效：尾部粒子
                if (this.isDashing) {
                    particles.push({
                        x: this.x,
                        y: this.y + this.height/2,
                        size: Math.random() * 8 + 3,
                        alpha: 1,
                        vx: -5,
                        color: '#ffd166'
                    });
                }

                // 重置碰撞盒（非滑行状态）
                if (!this.isSliding) {
                    this.hitbox = {
                        x: this.x + 10,
                        y: this.y + 5,
                        width: this.width - 20,
                        height: this.height - 10
                    };
                }

                // 调试：绘制碰撞盒（可注释）
                // ctx.strokeStyle = 'red';
                // ctx.strokeRect(this.hitbox.x, this.hitbox.y, this.hitbox.width, this.hitbox.height);
                ctx.restore();
            }
            // 更新角色物理状态（重力/跳跃/落地）
            update() {
                // 重力应用
                this.velocityY += GRAVITY;
                this.y += this.velocityY;
                this.hitbox.y += this.velocityY;

                // 冲刺状态更新
                if (this.isDashing) {
                    this.dashTime += 16; // 按帧时间累加
                    if (this.dashTime >= this.dashDuration) {
                        this.isDashing = false;
                        this.dashTime = 0;
                    }
                }

                // 落地检测（限制在画布底部）
                const groundY = canvas.height - 100;
                if (this.y >= groundY) {
                    this.y = groundY;
                    this.velocityY = 0;
                    this.isJumping = false;
                    this.canSecondJump = false; // 落地重置二段跳
                } else {
                    this.isJumping = true;
                    this.canSecondJump = true; // 空中开启二段跳
                }

                // 粒子特效更新
                this.updateParticles();
            }
            // 跳跃操作
            jump() {
                if (!this.isJumping) {
                    this.velocityY = JUMP_FORCE;
                    this.canSecondJump = true;
                } else if (this.canSecondJump) {
                    this.velocityY = SECOND_JUMP_FORCE;
                    this.canSecondJump = false; // 禁用二段跳
                }
            }
            // 滑行操作
            slide() {
                if (!this.isJumping) { // 落地才能滑行
                    this.isSliding = true;
                    setTimeout(() => {
                        this.isSliding = false;
                    }, 800); // 滑行持续800ms
                }
            }
            // 冲刺操作（道具触发）
            dash() {
                this.isDashing = true;
                this.dashTime = 0;
                comboTip.style.display = 'block';
                setTimeout(() => {
                    comboTip.style.display = 'none';
                }, 1000);
            }
            // 更新粒子特效
            updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.alpha -= 0.05;
                    p.size *= 0.95;
                    if (p.alpha <= 0) particles.splice(i, 1);
                }
                // 绘制粒子
                particles.forEach(p => {
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            }
        }

        // ---------------------- 面向对象 - 障碍（随机类型+动态速度）----------------------
        class Obstacle {
            constructor(speed) {
                this.speed = speed; // 障碍移动速度（随难度递增）
                this.type = Math.random() > 0.5 ? 'high' : 'low'; // 高障碍/矮障碍
                // 尺寸根据类型调整
                if (this.type === 'high') {
                    this.width = 40;
                    this.height = 80;
                } else {
                    this.width = 60;
                    this.height = 30;
                }
                this.x = canvas.width;
                this.y = canvas.height - 100 - this.height;
                // 碰撞盒
                this.hitbox = {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
                this.scored = false; // 是否已计分（避免重复加分）
            }
            // 绘制障碍
            draw() {
                ctx.fillStyle = this.type === 'high' ? '#2b2d42' : '#073b4c';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // 障碍装饰
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 10, this.y + 10, this.width - 20, this.height - 20);
                // 调试：绘制碰撞盒
                // ctx.strokeStyle = 'blue';
                // ctx.strokeRect(this.hitbox.x, this.hitbox.y, this.hitbox.width, this.hitbox.height);
            }
            // 更新障碍位置
            update() {
                this.x -= this.speed;
                this.hitbox.x -= this.speed;
                // 超出画布移除
                return this.x > -this.width;
            }
        }

        // ---------------------- 面向对象 - 道具（冲刺道具）----------------------
        class Prop {
            constructor(speed) {
                this.speed = speed;
                this.radius = 20;
                this.x = canvas.width + this.radius;
                this.y = canvas.height - 100 - this.radius * 2;
                this.colors = ['#ffd166', '#faa307'];
                this.frame = 0;
                this.animationSpeed = 5;
                this.frameCount = 0;
            }
            // 绘制道具（呼吸动画+双色切换）
            draw() {
                this.frameCount++;
                if (this.frameCount % this.animationSpeed === 0) {
                    this.frame = 1 - this.frame;
                }
                ctx.save();
                ctx.fillStyle = this.colors[this.frame];
                ctx.shadowColor = '#ffd166';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                // 道具图标（冲刺箭头）
                ctx.fillStyle = '#2b2d42';
                ctx.beginPath();
                ctx.moveTo(this.x - 8, this.y);
                ctx.lineTo(this.x + 8, this.y - 6);
                ctx.lineTo(this.x + 8, this.y + 6);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            // 更新道具位置
            update() {
                this.x -= this.speed;
                return this.x > -this.radius;
            }
            // 检测是否被收集
            isCollected(player) {
                const dx = this.x - (player.hitbox.x + player.hitbox.width/2);
                const dy = this.y - (player.hitbox.y + player.hitbox.height/2);
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < this.radius + player.hitbox.width/2;
            }
        }

        // ---------------------- 工具函数 - 碰撞检测/随机数/分数更新 ----------------------
        // 矩形碰撞检测
        function checkCollision(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }
        // 生成随机数（最小值-最大值）
        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }
        // 更新分数（结合连击倍数）
        function updateScore(points) {
            const multiplier = combo >= COMBO_DOUBLE_SCORE ? 2 : 1;
            score += points * multiplier;
            scoreEl.textContent = score;
            // 难度递增：分数每增加1000，障碍速度+0.5，生成间隔-100ms
            const level = Math.floor(score / 1000) + 1;
            return {
                speed: PLAYER_SPEED + (level * 0.5),
                interval: Math.max(500, OBSTACLE_SPAWN_INTERVAL - (level * 100))
            };
        }
        // 更新连击
        function updateCombo() {
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            comboEl.textContent = combo;
            // 连击提示
            if (combo === COMBO_DOUBLE_SCORE) {
                comboTip.style.display = 'block';
                setTimeout(() => {
                    comboTip.style.display = 'none';
                }, 1500);
            }
        }
        // 重置连击
        function resetCombo() {
            combo = 0;
            comboEl.textContent = combo;
        }

        // ---------------------- 游戏初始化/重置/结束 ----------------------
        let backgroundLayers = [];
        let player;
        let obstacleSpawnTimer;
        let lastObstacleTime = 0;
        let gameSpeed = PLAYER_SPEED;
        let spawnInterval = OBSTACLE_SPAWN_INTERVAL;

        // 初始化游戏
        function initGame() {
            // 初始化三层背景：近层（速度1）、中层（0.5）、远层（0.2）
            backgroundLayers = [
                new BackgroundLayer(1, '#ef476f', 100, canvas.height - 100),
                new BackgroundLayer(0.5, '#ffd166', 200, canvas.height - 200),
                new BackgroundLayer(0.2, '#06d6a0', 400, 0)
            ];
            // 初始化玩家
            player = new Player();
            // 清空对象池
            obstacles = [];
            props = [];
            particles = [];
            // 重置状态
            score = 0;
            combo = 0;
            maxCombo = 0;
            gameSpeed = PLAYER_SPEED;
            spawnInterval = OBSTACLE_SPAWN_INTERVAL;
            scoreEl.textContent = 0;
            comboEl.textContent = 0;
            gameState = 'playing';
            startTip.style.display = 'none';
            gameOverEl.style.display = 'none';
        }

        // 游戏结束
        function gameOver() {
            gameState = 'over';
            // 更新本地存储最高分和最高连击
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('parkourHighScore', highScore);
                finalHighScoreEl.textContent = highScore;
                highScoreEl.textContent = highScore;
            }
            if (maxCombo > highCombo) {
                highCombo = maxCombo;
                localStorage.setItem('parkourMaxCombo', highCombo);
                maxComboEl.textContent = highCombo;
            }
            // 显示游戏结束界面
            finalScoreEl.textContent = score;
            gameOverEl.style.display = 'block';
        }

        // 重新开始游戏
        function restartGame() {
            initGame();
            gameLoop();
        }

        // ---------------------- 游戏主循环（requestAnimationFrame 高性能）----------------------
        function gameLoop() {
            if (gameState !== 'playing') return;
            // 1. 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 2. 更新并绘制背景层（视差滚动）
            backgroundLayers.forEach(layer => {
                layer.update();
                layer.draw();
            });
            // 3. 更新并绘制玩家
            player.update();
            player.draw();
            // 4. 障碍生成（基于时间间隔，动态调整速度和间隔）
            const now = Date.now();
            if (now - lastObstacleTime > spawnInterval) {
                obstacles.push(new Obstacle(gameSpeed));
                // 随机生成道具
                if (Math.random() < PROP_SPAWN_RATE) {
                    props.push(new Prop(gameSpeed));
                }
                lastObstacleTime = now;
                // 更新游戏速度和生成间隔（难度递增）
                const levelData = updateScore(0);
                gameSpeed = levelData.speed;
                spawnInterval = levelData.interval;
            }
            // 5. 更新并绘制障碍，过滤超出画布的障碍
            obstacles = obstacles.filter(obstacle => {
                obstacle.update();
                obstacle.draw();
                // 碰撞检测：非冲刺状态下碰撞则游戏结束
                if (!player.isDashing && checkCollision(player.hitbox, obstacle.hitbox)) {
                    gameOver();
                }
                // 计分检测：障碍通过玩家后加分并更新连击
                if (!obstacle.scored && obstacle.x + obstacle.width < player.x) {
                    obstacle.scored = true;
                    updateScore(10);
                    updateCombo();
                }
                return obstacle.update();
            });
            // 6. 更新并绘制道具，过滤超出画布的道具
            props = props.filter(prop => {
                prop.update();
                prop.draw();
                // 道具收集检测
                if (prop.isCollected(player)) {
                    player.dash();
                    return false;
                }
                return prop.update();
            });
            // 7. 递归执行帧循环
            requestAnimationFrame(gameLoop);
        }

        // ---------------------- 事件监听（键盘+触摸）----------------------
        // 键盘控制：空格/上箭头=跳，下箭头=滑，R=重新开始
        document.addEventListener('keydown', (e) => {
            if (gameState === 'playing') {
                if (e.key === ' ' || e.key === 'ArrowUp') {
                    player.jump();
                } else if (e.key === 'ArrowDown') {
                    player.slide();
                }
            } else if (gameState === 'ready' && (e.key === ' ' || e.key === 'ArrowUp')) {
                initGame();
                gameLoop();
            } else if (gameState === 'over' && e.key === 'r') {
                restartGame();
            }
        });

        // 触摸控制：点击=跳，长按=滑，开始界面点击开始
        let touchStartTime = 0;
        const LONG_TOUCH_TIME = 300; // 长按判定时间(ms)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartTime = Date.now();
            if (gameState === 'ready') {
                initGame();
                gameLoop();
            } else if (gameState === 'playing') {
                player.jump();
            }
        });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touchDuration = Date.now() - touchStartTime;
            if (gameState === 'playing' && touchDuration >= LONG_TOUCH_TIME) {
                player.slide();
            }
        });
        // 防止移动端触摸滚动
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        // 重启按钮点击事件
        restartBtn.addEventListener('click', restartGame);
    </script>
</body>
</html>
